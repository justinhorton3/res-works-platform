[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "res-works"
version = "0.1.0"
description = "Local-first residential documentation workflow engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pypdf>=5.0,<7",
  "pypdfium2>=5.0,<6",
  "Pillow>=10.0,<13",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
