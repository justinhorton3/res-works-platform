[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "res-works"
version = "0.1.0"
description = "Local-first residential documentation workflow engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "pypdf>=5.0,<7",
  "pypdfium2>=5.0,<6",
  "reportlab>=4.0,<5",
  "Pillow>=10.0,<13",
  "ezdxf>=1.3,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx2>=0.1"]

[project.scripts]
res-works = "res_works.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
